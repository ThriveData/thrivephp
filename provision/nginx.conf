server {
	listen 80;
    #listen 443 ssl;
    #ssl_certificate /usr/local/etc/letsencrypt/live/thrive.lan/fullchain.pem;
    #ssl_certificate_key /usr/local/etc/letsencrypt/live/thrive.lan/privkey.pem;

    server_name thrive.lan;
    root /sites/thrive.lan/static;
    
    rewrite_log on;
    log_subrequest on;

    location / {
        try_files $uri /thrive.php$uri$is_args$args;
        index control.php;
    }

    location ~ \.php {
		fastcgi_pass 127.0.0.1:9000;
		fastcgi_read_timeout 2m;
		fastcgi_split_path_info ^(.*\.php)(/.+)$;

		fastcgi_param	SERVER_ADMIN		ian@thrivedata.it;
		fastcgi_param	SCRIPT_NAME			$fastcgi_script_name;	# /test.php
		fastcgi_param	PATH_INFO			$fastcgi_path_info;		# /stuff
		fastcgi_param	QUERY_STRING		$query_string;			# key=value
		fastcgi_param	REQUEST_URI			$request_uri;			# /test.php/stuff?key=value
		fastcgi_param	DOCUMENT_URI		$document_uri;			# /test.php/stuff
		fastcgi_param	DOCUMENT_ROOT		$document_root;			# /docroot
		#fastcgi_param	SCRIPT_FILENAME		$document_root$fastcgi_script_name;		# /docroot/test.php
		fastcgi_param	SCRIPT_FILENAME	$request_filename;		# /docroot/test.php

		fastcgi_param	SERVER_PROTOCOL		$server_protocol;
		fastcgi_param	HTTPS				$https if_not_empty;
		fastcgi_param	REQUEST_METHOD		$request_method;

		fastcgi_param	CONTENT_TYPE		$content_type;
		fastcgi_param	CONTENT_LENGTH		$content_length;

		fastcgi_param	GATEWAY_INTERFACE	CGI/1.1;
		fastcgi_param	SERVER_SOFTWARE		nginx/$nginx_version;

		fastcgi_param	REMOTE_ADDR			$remote_addr;
		fastcgi_param	REMOTE_PORT			$remote_port;
		fastcgi_param	SERVER_ADDR			$server_addr;
		fastcgi_param	SERVER_PORT			$server_port;
		fastcgi_param	SERVER_NAME			$server_name;
    }
}
